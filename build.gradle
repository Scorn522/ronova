plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

sourceSets {
    validationFixture {
        java.srcDir 'validation/7.14a/fixture/src/main/java'
        resources.srcDir 'validation/7.14a/fixture/src/main/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    def offlineRepository = System.getenv('RONOVA_OFFLINE_MAVEN')
    if (offlineRepository != null && !offlineRepository.isBlank()) {
        maven {
            url = uri(offlineRepository)
            metadataSources {
                mavenPom()
                gradleMetadata()
                artifact()
            }
        }
    }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

configurations {
    agentBootstrap
    validationFixtureImplementation.extendsFrom implementation
    validationFixtureCompileOnly.extendsFrom compileOnly
    validationFixtureRuntimeOnly.extendsFrom runtimeOnly
    configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.apache.logging.log4j'
                    && details.requested.version == '2.11.+') {
                details.useVersion '2.19.0'
                details.because 'Use the Forge 1.20.1 runtime version available in the reproducible build cache'
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    agentBootstrap 'org.ow2.asm:asm:9.7'
    agentBootstrap 'org.ow2.asm:asm-tree:9.7'
}

mixin {
    add sourceSets.main, 'ronova.refmap.json'
    config 'ronova.mixins.json'
}

tasks.named('processResources', ProcessResources).configure {
    def props = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version: forge_version,
        forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]
    inputs.properties props
    filesMatching(['META-INF/mods.toml']) { expand props }
}

def agentBootstrapJar = tasks.register('agentBootstrapJar', Jar) {
    archiveFileName = 'asm-support.jar'
    destinationDirectory = layout.buildDirectory.dir('agent-bootstrap')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ configurations.agentBootstrap.collect { zipTree(it) } }) {
        include 'org/objectweb/asm/**'
    }
}

def agentHookJar = tasks.register('agentHookJar', Jar) {
    dependsOn tasks.named('compileJava')
    archiveFileName = 'hook-support.jar'
    destinationDirectory = layout.buildDirectory.dir('agent-bootstrap')
    from(sourceSets.main.output.classesDirs) {
        include 'dev/ronova/coremod/agent/BootstrapHooks.class'
    }
}
def taskHookJar = tasks.register('taskHookJar', Jar) {
    dependsOn tasks.named('compileJava')
    archiveFileName = 'task-hook-support.jar'
    destinationDirectory = layout.buildDirectory.dir('agent-bootstrap')
    from(sourceSets.main.output.classesDirs) { include 'dev/ronova/coremod/agent/BootstrapTaskHooks*.class' }
}

tasks.named('jar', Jar).configure {
    dependsOn agentBootstrapJar, agentHookJar, taskHookJar
    // Only the current annotation-processor output may supply field mappings.
    // An old resource copy can silently hide newly added accessors.
    filesMatching('ronova.refmap.json') {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
    from(agentBootstrapJar.flatMap { it.archiveFile }) {
        into 'META-INF/ronova'
    }
    from(agentHookJar.flatMap { it.archiveFile }) {
        into 'META-INF/ronova'
    }
    from(taskHookJar.flatMap { it.archiveFile }) { into 'META-INF/ronova' }
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Version': '1',
            'Implementation-Title': mod_name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor': mod_authors,
            'MixinConfigs': 'ronova.mixins.json',
            'Premain-Class': 'dev.ronova.coremod.agent.RonovaAgent',
            'Agent-Class': 'dev.ronova.coremod.agent.RonovaAgent',
            'Can-Redefine-Classes': 'true',
            'Can-Retransform-Classes': 'true'
        ])
    }
    finalizedBy 'reobfJar'
}

def validationFixtureJar = tasks.register('validationFixtureJar', Jar) {
    group = 'verification'
    description = 'Builds the separately packaged 7.14A Forge validation fixture.'
    dependsOn tasks.named('validationFixtureClasses')
    archiveBaseName = 'ronova-7.14a-fixture'
    archiveVersion = '1.0.0'
    // Keep the fixture beside production archives so the validation runner has
    // one stable, inspectable path for the exact-artifact scenarios.
    destinationDirectory = layout.buildDirectory.dir('libs')
    from sourceSets.validationFixture.output
    manifest {
        attributes([
            'Specification-Title': 'Ronova 7.14A Validation Fixture',
            'MixinConfigs': 'ronova-fixture.mixins.json',
            'Specification-Version': '1',
            'Implementation-Title': 'Ronova 7.14A Validation Fixture',
            'Implementation-Version': '1.0.0',
            'Implementation-Vendor': mod_authors
        ])
    }
}

// ForgeGradle reobfuscates this JAR in place, independently of the production JAR.
reobf.create('validationFixtureJar')
def validationProbeAgentJar = tasks.register('validationProbeAgentJar', Jar) {
    dependsOn tasks.named('validationFixtureClasses')
    archiveFileName = 'ronova-validation-probe-agent.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
    from(sourceSets.validationFixture.output.classesDirs) {
        include 'dev/ronova/coremod/validation/agent/ProbeAgent.class'
    }
    manifest { attributes('Premain-Class': 'dev.ronova.coremod.validation.agent.ProbeAgent', 'Can-Retransform-Classes': 'true') }
}
validationFixtureJar.configure { dependsOn validationProbeAgentJar }
tasks.configureEach { task ->
    if (task.name != 'reobfJar') return
    inputs.file('native/build_code_seals.py')
    inputs.file('native/code_seal_inventory.py')
    inputs.file('native/src/ronova_native.cpp')
    inputs.file('native/src/storage_transaction.hpp')
    doLast {
        project.exec {
            commandLine 'python', file('native/build_code_seals.py').absolutePath,
                tasks.named('jar').get().archiveFile.get().asFile.absolutePath
        }
    }
}
validationFixtureJar.configure {
    finalizedBy tasks.named('reobfValidationFixtureJar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}


def packagedSelfTestClasspath = files(tasks.named('jar').flatMap { it.archiveFile })
    .plus(sourceSets.test.output)
    .plus(configurations.testRuntimeClasspath)
def developmentSelfTestClasspath = sourceSets.main.output
    .plus(sourceSets.test.output)
    .plus(configurations.testRuntimeClasspath)
def mappedRuntimeSelfTests = [
    'dev.ronova.coremod.observation.NbtStoragePreservationSelfTest',
    'dev.ronova.coremod.observation.NbtEncodingPathsSelfTest',
    'dev.ronova.coremod.observation.NbtStorageImageSelfTest',
    'dev.ronova.coremod.observation.StorageImageTaskSelfTest',
    'dev.ronova.coremod.persistence.DurableRootStoreSelfTest',
    'dev.ronova.coremod.persistence.StrengthPolicyPersistenceSelfTest'
] as Set

def standaloneSelfTestTasks = standaloneSelfTests.collect { testClass ->
    def simpleName = testClass.substring(testClass.lastIndexOf('.') + 1)
    tasks.register("run${simpleName}", JavaExec) {
        group = 'verification'
        description = mappedRuntimeSelfTests.contains(testClass)
            ? "Runs ${testClass} against the development main output for mapped Minecraft compatibility."
            : "Runs ${testClass} against the reobfuscated production artifact."
        dependsOn tasks.named('testClasses'), tasks.named('reobfJar')
        mainClass.set(testClass)
        classpath = mappedRuntimeSelfTests.contains(testClass)
            ? developmentSelfTestClasspath : packagedSelfTestClasspath
    }
}

tasks.register('selfTest') {
    group = 'verification'
    description = 'Runs every standalone regression test shipped with Ronova.'
    dependsOn standaloneSelfTestTasks
}

tasks.register('inspectDurableRoot', JavaExec) {
    group = 'verification'
    description = 'Read-only validation of explicitly supplied archived Root images.'
    dependsOn tasks.named('testClasses')
    mainClass.set('dev.ronova.coremod.persistence.DurableRootStoreSelfTest')
    classpath = developmentSelfTestClasspath
    doFirst {
        if (!project.hasProperty('rootImages')) throw new GradleException('Pass -ProotImages=path1;path2')
        args = ['--inspect-root'] + project.property('rootImages').toString().split(';').toList()
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('selfTest')
}

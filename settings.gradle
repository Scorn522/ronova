pluginManagement {
    repositories {
        def offlineRepository = System.getenv('RONOVA_PLUGIN_MAVEN') ?: System.getenv('RONOVA_OFFLINE_MAVEN')
        if (offlineRepository != null && !offlineRepository.isBlank()) {
            maven { url = uri(offlineRepository) }
        }
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'net.minecraftforge.gradle') {
                useModule("net.minecraftforge.gradle:ForgeGradle:${requested.version}")
            }
            if (requested.id.id == 'org.spongepowered.mixin') {
                useModule('org.spongepowered:mixingradle:0.7-SNAPSHOT')
            }
        }
    }
}

rootProject.name = 'ronova'
